name: Mush8 - Compilar IPA iOS

on:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: "ID de ejecución anterior para reutilizar NSP (vacío = descargar del VPS)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: mush8-ios-build
  cancel-in-progress: false

jobs:
  prepare:
    name: Descargar y verificar archivos
    # Solo hace curl/sha256/cp: no necesita macOS (que cuesta 10x en minutos).
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Intentar recuperar artefactos anteriores
        if: ${{ inputs.reuse_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mush8-build-inputs-${{ inputs.reuse_run_id }}
          path: cached-inputs
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}

      - name: Obtener archivos del artefacto o del VPS
        env:
          TRANSFER_USER: ${{ secrets.TRANSFER_USER }}
          TRANSFER_PASS: ${{ secrets.TRANSFER_PASS }}
          TRANSFER_BASE_URL: ${{ secrets.TRANSFER_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          mkdir -p downloads

          if [[ -s cached-inputs/base.nsp ]] &&
             [[ -s cached-inputs/upd4-0-1.nsp ]] &&
             [[ -s cached-inputs/dlc.nsp ]]; then

            echo "Reutilizando los archivos de una ejecución anterior."

            mv cached-inputs/base.nsp downloads/baseGame.nsp
            mv cached-inputs/upd4-0-1.nsp downloads/update401.nsp
            mv cached-inputs/dlc.nsp downloads/dlc.nsp
            exit 0
          fi

          echo "Artefacto anterior no disponible. Descargando del VPS."

          rm -rf downloads
          mkdir -p downloads

          if [[ -z "$TRANSFER_USER" ||
                -z "$TRANSFER_PASS" ||
                -z "$TRANSFER_BASE_URL" ]]; then
            echo "::error::Faltan los secretos de transferencia."
            exit 1
          fi

          if [[ "$TRANSFER_BASE_URL" != https://* ]]; then
            echo "::error::TRANSFER_BASE_URL debe usar https."
            exit 1
          fi

          # Credenciales en un archivo temporal (no en la lista de procesos)
          curl_config="$(mktemp)"
          trap 'rm -f "$curl_config"' EXIT
          printf 'user = "%s:%s"\n' "$TRANSFER_USER" "$TRANSFER_PASS" > "$curl_config"

          for file in baseGame.nsp update401.nsp dlc.nsp; do
            echo "::group::Descargando $file"

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --proto '=https' \
              --connect-timeout 30 \
              --max-time 7200 \
              --retry 2 \
              --retry-delay 5 \
              --config "$curl_config" \
              --output "downloads/$file" \
              "${TRANSFER_BASE_URL%/}/$file"

            if [[ ! -s "downloads/$file" ]]; then
              echo "::error::Archivo vacío: $file"
              exit 1
            fi

            ls -lh "downloads/$file"
            echo "::endgroup::"
          done

      - name: Verificar SHA-256
        env:
          SHA256_BASEGAME: ${{ secrets.SHA256_BASEGAME }}
          SHA256_UPDATE401: ${{ secrets.SHA256_UPDATE401 }}
          SHA256_DLC: ${{ secrets.SHA256_DLC }}
        shell: bash
        run: |
          set -euo pipefail

          verify_sha256() {
            local file="$1"
            local expected="$2"
            local actual

            if [[ ! "$expected" =~ ^[a-fA-F0-9]{64}$ ]]; then
              echo "::error::SHA-256 ausente o inválido para $file."
              exit 1
            fi

            actual="$(sha256sum "downloads/$file" | awk '{print $1}')"
            actual="$(printf '%s' "$actual" | tr '[:upper:]' '[:lower:]')"
            expected="$(printf '%s' "$expected" | tr '[:upper:]' '[:lower:]')"

            if [[ "$actual" != "$expected" ]]; then
              echo "::error::SHA-256 incorrecto para $file."
              exit 1
            fi

            echo "SHA-256 correcto: $file"
          }

          verify_sha256 baseGame.nsp "$SHA256_BASEGAME"
          verify_sha256 update401.nsp "$SHA256_UPDATE401"
          verify_sha256 dlc.nsp "$SHA256_DLC"

      - name: Preparar archivos intermedios
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          mkdir -p build-inputs

          mv downloads/baseGame.nsp build-inputs/base.nsp
          mv downloads/update401.nsp build-inputs/upd4-0-1.nsp
          mv downloads/dlc.nsp build-inputs/dlc.nsp

          test -s build-inputs/base.nsp
          test -s build-inputs/upd4-0-1.nsp
          test -s build-inputs/dlc.nsp

          echo "Archivos verificados y preparados."

      - name: Guardar archivos para reutilización
        uses: actions/upload-artifact@v4
        with:
          name: mush8-build-inputs-${{ github.run_id }}
          path: build-inputs/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Limpiar archivos locales de preparación
        if: always()
        shell: bash
        run: |
          rm -rf downloads build-inputs cached-inputs

  build:
    name: Compilar y publicar IPA
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 360

    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Recuperar archivos verificados
        uses: actions/download-artifact@v4
        with:
          name: mush8-build-inputs-${{ github.run_id }}
          path: build-inputs

      - name: Preparar archivos para Mush8
        env:
          PROD_KEYS_BASE64: ${{ secrets.PROD_KEYS_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          if [[ -z "$PROD_KEYS_BASE64" ]]; then
            echo "::error::Falta el secreto PROD_KEYS_BASE64."
            exit 1
          fi

          printf '%s' "$PROD_KEYS_BASE64" | base64 -D > prod.keys

          if [[ ! -s prod.keys ]]; then
            echo "::error::prod.keys está vacío."
            exit 1
          fi

          test -s build-inputs/base.nsp
          test -s build-inputs/upd4-0-1.nsp
          test -s build-inputs/dlc.nsp

          mkdir -p game-files
          mv build-inputs/base.nsp game-files/base.nsp
          mv build-inputs/upd4-0-1.nsp game-files/upd4-0-1.nsp
          mv build-inputs/dlc.nsp game-files/dlc.nsp

          # Hard links: los archivos que el script espera en la raíz, sin duplicar disco
          ln game-files/base.nsp base.nsp
          ln game-files/upd4-0-1.nsp upd4-0-1.nsp

          echo "Archivos preparados."
          ls -lh base.nsp upd4-0-1.nsp game-files/

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail

          xcode-select -p
          xcodebuild -version
          echo "Versiones de Xcode instaladas en el runner:"
          ls -d /Applications/Xcode*.app || true

          sudo xcodebuild -license accept

          brew install xcodegen cmake pkgconf rustup

      - name: Configurar Rust
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/opt/homebrew/opt/rustup/bin:$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"

          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1

          rustc --version
          cargo --version
          xcodegen --version

      - name: Compilar Mush8 para iOS
        shell: bash
        env:
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail

          chmod +x make-ios.sh

          # El linker de Xcode 26.6 falla con:
          #   ld: Assertion failed: "compact unwind compressed function offset doesn't fit in 24 bits"
          # Se usa un wrapper de "cc" que agrega un flag de linker. Se prueba primero
          # el linker clásico (conserva el unwind info) y, si no sirve, se desactiva
          # el compact unwind como último recurso.
          wrapper="$RUNNER_TEMP/cc-wrapper.sh"
          built=0

          for flag in "-Wl,-ld_classic" "-Wl,-no_compact_unwind"; do
            echo "::group::Intento con flag de linker: $flag"

            printf '#!/bin/bash\nexec cc "$@" %s\n' "$flag" > "$wrapper"
            chmod +x "$wrapper"

            if CARGO_TARGET_AARCH64_APPLE_IOS_LINKER="$wrapper" ./make-ios.sh --ipa; then
              built=1
              echo "::endgroup::"
              echo "Compilación correcta con: $flag"
              break
            fi

            echo "::endgroup::"
            echo "::warning::Falló la compilación con $flag"
          done

          if [[ "$built" -ne 1 ]]; then
            echo "::error::Fallaron todos los intentos de linker."
            exit 1
          fi

          IPA="build/Mush8.ipa"

          if [[ ! -s "$IPA" ]]; then
            echo "::error::No se generó build/Mush8.ipa."
            exit 1
          fi

          unzip -t "$IPA"
          ls -lh "$IPA"

      - name: Publicar IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-iOS-IPA
          path: build/Mush8.ipa
          if-no-files-found: error
          # Mínimo permitido: descárgalo y bórralo cuanto antes
          retention-days: 1

      - name: Borrar artefacto con los NSP (solo si todo salió bien)
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          ids="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name == "mush8-build-inputs-${{ github.run_id }}") | .id')"

          for id in $ids; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
            echo "Artefacto de entradas borrado: $id"
          done

      - name: Limpiar archivos locales y claves
        if: always()
        shell: bash
        run: |
          rm -f prod.keys base.nsp upd4-0-1.nsp
          rm -rf build-inputs game-files
