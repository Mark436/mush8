name: Mush8 - Compilar IPA iOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mush8-ios-build
  cancel-in-progress: false

jobs:
  build:
    name: Descargar, verificar y compilar
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar archivos desde el VPS
        env:
          TRANSFER_USER: ${{ secrets.TRANSFER_USER }}
          TRANSFER_PASS: ${{ secrets.TRANSFER_PASS }}
          TRANSFER_BASE_URL: ${{ secrets.TRANSFER_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads

          for file in baseGame.nsp update401.nsp dlc.nsp; do
            echo "::group::Descargando $file"

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --connect-timeout 30 \
              --max-time 7200 \
              --retry 5 \
              --retry-delay 10 \
              --retry-all-errors \
              --user "$TRANSFER_USER:$TRANSFER_PASS" \
              --output "downloads/$file" \
              "${TRANSFER_BASE_URL%/}/$file"

            test -s "downloads/$file"
            echo "Descarga completada: $file"
            echo "::endgroup::"
          done

      - name: Verificar SHA-256
        env:
          SHA256_BASEGAME: ${{ secrets.SHA256_BASEGAME }}
          SHA256_UPDATE401: ${{ secrets.SHA256_UPDATE401 }}
          SHA256_DLC: ${{ secrets.SHA256_DLC }}
        shell: bash
        run: |
          set -euo pipefail

          verify_sha256() {
            local file="$1"
            local expected="$2"
            local actual

            if [[ ! "$expected" =~ ^[a-fA-F0-9]{64}$ ]]; then
              echo "::error::El SHA-256 esperado de $file no es válido."
              exit 1
            fi

            actual="$(shasum -a 256 "downloads/$file" | awk '{print $1}')"

            if [[ "${actual,,}" != "${expected,,}" ]]; then
              echo "::error::SHA-256 incorrecto para $file"
              exit 1
            fi

            echo "SHA-256 correcto: $file"
          }

          verify_sha256 baseGame.nsp "$SHA256_BASEGAME"
          verify_sha256 update401.nsp "$SHA256_UPDATE401"
          verify_sha256 dlc.nsp "$SHA256_DLC"

      - name: Preparar archivos del juego y claves
        env:
          PROD_KEYS_BASE64: ${{ secrets.PROD_KEYS_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          if [[ -z "$PROD_KEYS_BASE64" ]]; then
            echo "::error::Falta el secreto PROD_KEYS_BASE64."
            exit 1
          fi

          printf '%s' "$PROD_KEYS_BASE64" | base64 -D > prod.keys

          if [[ ! -s prod.keys ]] ||
             ! grep -Eq '^[[:space:]]*master_key_[[:xdigit:]]{2}[[:space:]]*=' prod.keys; then
            echo "::error::prod.keys no es válido o no tiene el formato esperado."
            exit 1
          fi

          cp downloads/baseGame.nsp base.nsp
          cp downloads/update401.nsp upd4-0-1.nsp
          cp downloads/dlc.nsp dlc.nsp

          test -s base.nsp
          test -s upd4-0-1.nsp
          test -s dlc.nsp

          echo "Archivos preparados correctamente."

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -version
          sudo xcodebuild -license accept

          brew install xcodegen cmake pkgconf rustup

          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/rustup/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Configurar Rust
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/opt/homebrew/opt/rustup/bin:$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"

          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1

          rustc --version
          cargo --version
          xcodegen --version

      - name: Compilar Mush8
        shell: bash
        env:
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail

          chmod +x make-ios.sh
          ./make-ios.sh --ipa

          if [[ ! -s build/Mush8.ipa ]]; then
            echo "::error::No se generó build/Mush8.ipa."
            exit 1
          fi

          ls -lh build/Mush8.ipa

      - name: Publicar IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-iOS-IPA
          path: build/Mush8.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Limpiar archivos sensibles y descargados
        if: always()
        shell: bash
        run: |
          rm -f prod.keys
          rm -f base.nsp upd4-0-1.nsp dlc.nsp
          rm -rf downloads
