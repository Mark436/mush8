
name: Mush8 - Compilar IPA iOS

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: mush8-ios-build
  cancel-in-progress: false

jobs:
  prepare:
    name: Descargar y verificar archivos
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Descargar archivos desde el VPS
        env:
          TRANSFER_USER: ${{ secrets.TRANSFER_USER }}
          TRANSFER_PASS: ${{ secrets.TRANSFER_PASS }}
          TRANSFER_BASE_URL: ${{ secrets.TRANSFER_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads

          if [[ -z "$TRANSFER_USER" || -z "$TRANSFER_PASS" || -z "$TRANSFER_BASE_URL" ]]; then
            echo "::error::Falta configurar los secretos de transferencia."
            exit 1
          fi

          for file in baseGame.nsp update401.nsp dlc.nsp; do
            echo "::group::Descargando $file"

            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --connect-timeout 30 \
              --max-time 7200 \
              --retry 2 \
              --retry-delay 5 \
              --user "$TRANSFER_USER:$TRANSFER_PASS" \
              --output "downloads/$file" \
              "${TRANSFER_BASE_URL%/}/$file"

            if [[ ! -s "downloads/$file" ]]; then
              echo "::error::Archivo vacío: $file"
              exit 1
            fi

            echo "Descarga correcta: $file"
            ls -lh "downloads/$file"
            echo "::endgroup::"
          done

      - name: Verificar SHA-256
        env:
          SHA256_BASEGAME: ${{ secrets.SHA256_BASEGAME }}
          SHA256_UPDATE401: ${{ secrets.SHA256_UPDATE401 }}
          SHA256_DLC: ${{ secrets.SHA256_DLC }}
        shell: bash
        run: |
          set -euo pipefail

          verify_sha256() {
            local file="$1"
            local expected="$2"
            local actual

            if [[ ! "$expected" =~ ^[a-fA-F0-9]{64}$ ]]; then
              echo "::error::SHA-256 ausente o inválido para $file."
              exit 1
            fi

            actual="$(shasum -a 256 "downloads/$file" | awk '{print $1}')"
            actual="$(printf '%s' "$actual" | tr '[:upper:]' '[:lower:]')"
            expected="$(printf '%s' "$expected" | tr '[:upper:]' '[:lower:]')"

            if [[ "$actual" != "$expected" ]]; then
              echo "::error::SHA-256 incorrecto para $file."
              exit 1
            fi

            echo "SHA-256 correcto: $file"
          }

          verify_sha256 baseGame.nsp "$SHA256_BASEGAME"
          verify_sha256 update401.nsp "$SHA256_UPDATE401"
          verify_sha256 dlc.nsp "$SHA256_DLC"

      - name: Preparar archivos intermedios
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          mkdir -p build-inputs

          cp downloads/baseGame.nsp build-inputs/base.nsp
          cp downloads/update401.nsp build-inputs/upd4-0-1.nsp
          cp downloads/dlc.nsp build-inputs/dlc.nsp

          test -s build-inputs/base.nsp
          test -s build-inputs/upd4-0-1.nsp
          test -s build-inputs/dlc.nsp

          echo "Archivos verificados y preparados."

      - name: Guardar entradas temporalmente para compilar
        uses: actions/upload-artifact@v4
        with:
          name: mush8-build-inputs-${{ github.run_id }}
          path: build-inputs/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Limpiar archivos descargados
        if: always()
        shell: bash
        run: |
          rm -rf downloads build-inputs

  build:
    name: Compilar y publicar IPA
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Recuperar archivos verificados
        uses: actions/download-artifact@v4
        with:
          name: mush8-build-inputs-${{ github.run_id }}
          path: build-inputs

      - name: Preparar archivos para Mush8
        env:
          PROD_KEYS_BASE64: ${{ secrets.PROD_KEYS_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          if [[ -z "$PROD_KEYS_BASE64" ]]; then
            echo "::error::Falta el secreto PROD_KEYS_BASE64."
            exit 1
          fi

          printf '%s' "$PROD_KEYS_BASE64" | base64 -D > prod.keys

          if [[ ! -s prod.keys ]]; then
            echo "::error::prod.keys está vacío."
            exit 1
          fi

          test -s build-inputs/base.nsp
          test -s build-inputs/upd4-0-1.nsp
          test -s build-inputs/dlc.nsp

          cp build-inputs/base.nsp base.nsp
          cp build-inputs/upd4-0-1.nsp upd4-0-1.nsp

          mkdir -p game-files
          cp build-inputs/base.nsp game-files/base.nsp
          cp build-inputs/upd4-0-1.nsp game-files/upd4-0-1.nsp
          cp build-inputs/dlc.nsp game-files/dlc.nsp

          echo "Archivos preparados."
          ls -lh base.nsp upd4-0-1.nsp game-files/

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -version
          sudo xcodebuild -license accept

          brew install xcodegen cmake pkgconf rustup

      - name: Configurar Rust
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/opt/homebrew/opt/rustup/bin:$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"

          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1

          rustc --version
          cargo --version
          xcodegen --version

      - name: Compilar Mush8 para iOS
        shell: bash
        env:
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail

          chmod +x make-ios.sh
          ./make-ios.sh --ipa

          IPA="build/Mush8.ipa"

          if [[ ! -s "$IPA" ]]; then
            echo "::error::No se generó build/Mush8.ipa."
            exit 1
          fi

          unzip -t "$IPA"
          ls -lh "$IPA"

      - name: Publicar IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-iOS-IPA
          path: build/Mush8.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Eliminar artefacto intermedio de NSP
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = `mush8-build-inputs-${context.runId}`;

            const result = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100
            });

            const artifacts = result.data.artifacts.filter(
              artifact => artifact.name === artifactName
            );

            for (const artifact of artifacts) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });

              core.info(`Artefacto intermedio eliminado: ${artifact.name}`);
            }

            if (artifacts.length === 0) {
              core.info('No queda ningún artefacto intermedio con ese nombre.');
            }

      - name: Limpiar archivos locales y claves
        if: always()
        shell: bash
        run: |
          rm -f prod.keys base.nsp upd4-0-1.nsp
          rm -rf downloads build-inputs game-files
