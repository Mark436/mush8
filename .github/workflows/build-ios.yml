
name: Mush8 - Compilar IPA iOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mush8-ios-build
  cancel-in-progress: false

jobs:
  build:
    name: Descargar, verificar y compilar
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Descargar archivos desde el VPS
        env:
          TRANSFER_USER: ${{ secrets.TRANSFER_USER }}
          TRANSFER_PASS: ${{ secrets.TRANSFER_PASS }}
          TRANSFER_BASE_URL: ${{ secrets.TRANSFER_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads

          if [[ -z "$TRANSFER_USER" || -z "$TRANSFER_PASS" || -z "$TRANSFER_BASE_URL" ]]; then
            echo "::error::Falta configurar los secretos de transferencia."
            exit 1
          fi

          for file in baseGame.nsp update401.nsp dlc.nsp; do
            echo "::group::Descargando $file"

            output="downloads/$file"
            rm -f "$output"

            echo "=========================================="
            echo "Archivo: $file"
            echo "Iniciando descarga desde el VPS..."
            echo "=========================================="

            curl \
              --fail \
              --show-error \
              --location \
              --connect-timeout 30 \
              --max-time 7200 \
              --retry 2 \
              --retry-delay 5 \
              --user "$TRANSFER_USER:$TRANSFER_PASS" \
              --progress-bar \
              --output "$output" \
              --write-out $'\n\nResultado de descarga:\n  HTTP: %{http_code}\n  Recibido: %{size_download} bytes\n  Velocidad media: %{speed_download} bytes/s\n  Tiempo total: %{time_total} segundos\n' \
              "${TRANSFER_BASE_URL%/}/$file"

            if [[ ! -s "$output" ]]; then
              echo "::error::El servidor devolvió un archivo vacío: $file"
              exit 1
            fi

            size="$(stat -f%z "$output")"
            size_mb="$(awk -v s="$size" 'BEGIN {printf "%.2f", s/1048576}')"

            echo "=========================================="
            echo "Descarga completada: $file"
            echo "Tamaño final: $size bytes ($size_mb MiB)"
            echo "=========================================="

            echo "::endgroup::"
          done

      - name: Verificar SHA-256
        env:
          SHA256_BASEGAME: ${{ secrets.SHA256_BASEGAME }}
          SHA256_UPDATE401: ${{ secrets.SHA256_UPDATE401 }}
          SHA256_DLC: ${{ secrets.SHA256_DLC }}
        shell: bash
        run: |
          set -euo pipefail

          verify_sha256() {
            local file="$1"
            local expected="$2"
            local actual

            if [[ ! "$expected" =~ ^[a-fA-F0-9]{64}$ ]]; then
              echo "::error::SHA-256 ausente o inválido para $file."
              exit 1
            fi

            actual="$(shasum -a 256 "downloads/$file" | awk '{print $1}')"

            if [[ "${actual,,}" != "${expected,,}" ]]; then
              echo "::error::SHA-256 incorrecto para $file."
              exit 1
            fi

            echo "SHA-256 correcto: $file"
          }

          verify_sha256 baseGame.nsp "$SHA256_BASEGAME"
          verify_sha256 update401.nsp "$SHA256_UPDATE401"
          verify_sha256 dlc.nsp "$SHA256_DLC"

      - name: Preparar NSP y claves
        env:
          PROD_KEYS_BASE64: ${{ secrets.PROD_KEYS_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          if [[ -z "$PROD_KEYS_BASE64" ]]; then
            echo "::error::Falta el secreto PROD_KEYS_BASE64."
            exit 1
          fi

          printf '%s' "$PROD_KEYS_BASE64" | base64 -D > prod.keys

          if [[ ! -s prod.keys ]]; then
            echo "::error::prod.keys está vacío."
            exit 1
          fi

          cp downloads/baseGame.nsp base.nsp
          cp downloads/update401.nsp upd4-0-1.nsp

          mkdir -p game-files
          cp base.nsp game-files/base.nsp
          cp upd4-0-1.nsp game-files/upd4-0-1.nsp
          cp downloads/dlc.nsp game-files/dlc.nsp

          test -s base.nsp
          test -s upd4-0-1.nsp
          test -s game-files/dlc.nsp

          echo "Archivos preparados correctamente."
          ls -lh base.nsp upd4-0-1.nsp game-files/

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -version
          sudo xcodebuild -license accept

          brew install xcodegen cmake pkgconf rustup

          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/rustup/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Configurar Rust
        shell: bash
        run: |
          set -euo pipefail

          export PATH="/opt/homebrew/opt/rustup/bin:$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"

          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1

          rustc --version
          cargo --version
          xcodegen --version

      - name: Compilar Mush8 para iOS
        shell: bash
        env:
          CARGO_TERM_COLOR: always
        run: |
          set -euo pipefail

          chmod +x make-ios.sh
          ./make-ios.sh --ipa

          if [[ ! -s build/Mush8.ipa ]]; then
            echo "::error::No se generó build/Mush8.ipa."
            exit 1
          fi

          echo "IPA generado correctamente:"
          ls -lh build/Mush8.ipa

      - name: Publicar IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-iOS-IPA
          path: build/Mush8.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Publicar archivos del juego
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-Game-Files
          path: game-files/
          if-no-files-found: error
          retention-days: 7

      - name: Limpiar claves y archivos temporales
        if: always()
        shell: bash
        run: |
          rm -f prod.keys
          rm -f base.nsp upd4-0-1.nsp
          rm -rf downloads game-files
