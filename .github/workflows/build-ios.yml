
name: Build Mush8 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout Mush8
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1
          rustup target add aarch64-apple-ios \
            --toolchain 1.98.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare prod.keys
        env:
          PROD_KEYS_BASE64: ${{ secrets.PROD_KEYS_BASE64 }}
        run: |
          if [ -z "$PROD_KEYS_BASE64" ]; then
            echo "Missing PROD_KEYS_BASE64 secret"
            exit 1
          fi

          printf '%s' "$PROD_KEYS_BASE64" \
            | base64 -D > prod.keys

          test -s prod.keys
          echo "prod.keys created successfully"

      - name: Debug prod.keys location
        run: |
          echo "Current directory:"
          pwd
          echo "Checking prod.keys:"
          ls -l prod.keys
          echo "Searching repository:"
          find . -name 'prod.keys' -print

      - name: Build IPA
        run: ./make-ios.sh --ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-IPA
          path: build/Mush8.ipa
          if-no-files-found: error
          retention-days: 7
