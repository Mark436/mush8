
name: Test prod.keys

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-26

    steps:
      - name: Checkout Mush8
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test prod.keys secret
        env:
          PROD_KEYS_BASE64: ${{ secrets.PROD_KEYS_BASE64 }}
        run: |
          set -eu

          if [ -z "$PROD_KEYS_BASE64" ]; then
            echo "::error::El secreto PROD_KEYS_BASE64 está vacío o no existe"
            exit 1
          fi

          printf '%s' "$PROD_KEYS_BASE64" \
            | base64 -D > "$RUNNER_TEMP/prod.keys"

          if [ ! -s "$RUNNER_TEMP/prod.keys" ]; then
            echo "::error::El archivo decodificado está vacío"
            exit 1
          fi

          echo "OK: el secreto existe"
          echo "OK: Base64 se decodificó correctamente"
          echo "OK: prod.keys tiene contenido"
          echo "Tamaño: $(wc -c < "$RUNNER_TEMP/prod.keys" | tr -d ' ') bytes"

          rm -f "$RUNNER_TEMP/prod.keys"
